cross_val:
  pipeline:
    classifier: 'ET'
    transformation: 'CLR'
    scaler: 'Standard'
    smote: False
    reduction: null

  param_grid:
    classifier__n_estimators: [50, 100, 200, 500]
    classifier__max_depth: [5, 10, 20, null]
    classifier__min_samples_split: [2, 5, 10]
    classifier__class_weight: ['balanced', null]

  n_folds: 5
  random_state: 42
  shuffle: True
  save: False
  visualize: False
  njobs: -1
  save_format: 'csv'  # For metrics DataFrame

  scorings: 
    - accuracy 
    - precision
    - recall
    - f1
    - roc_auc

optuna:
  pipeline:
    classifier: 'XGB'
    transformation: 'CLR'
    scaler: 'Standard'
    smote: False
    reduction: 'None'
  classifier_params: # Parametri specifici per XGBClassifier
    n_estimators: 200
    learning_rate: 0.1
    random_state: 42

  n_trials: 3
  direction: 'maximize'
  scoring: 'accuracy'
  shuffle: True
  random_state: 42
  save: False
  save_format: 'csv'
  njobs: -1