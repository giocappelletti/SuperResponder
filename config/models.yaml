cross_val:
  pipeline:
    classifier: 'Ridge'
    transformation: 'CLR'
    scaler: 'Standard'
    smote: False
    reduction: 'None'

  n_folds: 2
  random_state: 42
  shuffle: True
  save: True
  visualize: False
  njobs: -1
  save_format: 'csv'  # For metrics DataFrame

  scorings: 
    - accuracy 
    - precision
    - recall
    - f1
    - roc_auc

optuna:
  pipeline:
    classifier: 'XGB'
    transformation: 'CLR'
    scaler: 'Standard'
    smote: False
    reduction: 'None'

  n_trials: 3
  direction: 'maximize'
  scoring: 'accuracy'
  shuffle: True
  random_state: 42
  save: False
  save_format: 'csv'
  njobs: -1