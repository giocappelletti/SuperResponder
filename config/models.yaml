cross_val:
  pipeline:
    classifier: 'LR'
    transformation: 'CLR'
    scaler: 'Standard'
    smote: False
    reduction: null

  param_grid:
    classifier__l1_ratio: [0]
    classifier__C:
      _type_: logspace
      start: -3
      stop: 3
      num: 150
    classifier__random_state: [42]

  n_folds: 5
  random_state: 42
  shuffle: True
  save: False
  visualize: False
  njobs: -1
  save_format: 'csv'  # For metrics DataFrame

  scorings: 
    - accuracy 
    - precision
    - recall
    - f1
    - roc_auc

optuna:
  pipeline:
    classifier: 'XGB'
    transformation: 'CLR'
    scaler: 'Standard'
    smote: False
    reduction: 'None'
  classifier_params: 
    n_estimators: 200
    learning_rate: 0.1
    random_state: 42

  n_trials: 3
  direction: 'maximize'
  scoring: 'accuracy'
  shuffle: True
  random_state: 42
  save: False
  save_format: 'csv'
  njobs: -1